<!DOCTYPE html>
<html>
<body>

<h2>Marriage Eligibility</h2>

<form method="post">
    {% csrf_token %}

    <label>Age:</label>
    <input type="number" name="age">

    <br><br>

    <label>Gender:</label>
    <select name="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>

    <br><br>

    <button type="submit">Check</button>
</form>

<h3>{{ result }}</h3>

<a href="/">Year Check</a>

</body>
</html>
