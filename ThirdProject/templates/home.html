<!DOCTYPE html>
<html>
<head>
    <title>Addition Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:450px;
            margin:100px auto;
            padding:30px;
            background:white;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
            color:navy;
        }

        table{
            width:100%;
        }

        td{
            padding:10px;
            font-size:18px;
        }

        input[type=number]{
            width:100%;
            padding:8px;
            font-size:16px;
        }

        .btn{
            text-align:center;
        }

        input[type=submit]{
            background:green;
            color:white;
            border:none;
            padding:10px 25px;
            font-size:18px;
            border-radius:5px;
            cursor:pointer;
        }
    </style>

</head>
<body>

<div class="container">

<h2>Addition Form</h2>

<form method="get" action="display/">

<table>

<tr>
    <td>Number 1</td>
    <td>
        <input type="number" name="num1">
    </td>
</tr>

<tr>
    <td>Number 2</td>
    <td>
        <input type="number" name="num2">
    </td>
</tr>

<tr>
    <td colspan="2" class="btn">
        <input type="submit" value="Submit">
    </td>
</tr>

</table>

</form>

</div>

</body>
</html>
