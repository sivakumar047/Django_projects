<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:500px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;
        }

        h2{
            color:navy;
        }

        p{
            font-size:22px;
            color:green;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Addition Result</h2>

    <p>
        The sum of {{ num1 }} and {{ num2 }} is <b>{{ total }}</b>
    </p>

</div>
</body>
</html>
